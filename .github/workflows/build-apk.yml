name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Convert logo to valid PNG
        run: |
          if [ -f app/src/main/res/drawable/app_logo.jpg ]; then
            convert app/src/main/res/drawable/app_logo.jpg -resize 512x512 app/src/main/res/drawable/app_logo.png
            rm -f app/src/main/res/drawable/app_logo.jpg
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyStrangerPro-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyStrangerPro-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
